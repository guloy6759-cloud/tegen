<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tegen Admin Panel</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
    header{background:#111827;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
    header h1{margin:0;font-size:22px}
    .container{max-width:1100px;margin:30px auto;padding:0 20px}
    .login{max-width:400px;margin:80px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
    .login h2{margin-top:0}
    input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
    button{border:0;padding:12px 18px;border-radius:8px;background:#2563eb;color:white;cursor:pointer;font-size:15px}
    .logout{background:#dc2626}
    .dashboard{display:none}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}
    .card{background:white;padding:25px;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
    .card h3{margin:0 0 10px;color:#666}
    .number{font-size:32px;font-weight:bold}
    .section{background:white;padding:25px;border-radius:14px;margin-bottom:25px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
    table{width:100%;border-collapse:collapse;margin-top:15px}
    th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
    th{background:#f9fafb}
    .message{margin-top:12px;color:#dc2626}
    @media(max-width:600px){
      .container{padding:0 12px}
      table{font-size:13px}
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Tegen Admin</h1>
  <button class="logout" onclick="logout()">Chiqish</button>
</header>

<div id="loginPage" class="login">
  <h2>Admin kirish</h2>

  <input id="username" type="text" placeholder="Login">

  <input id="password" type="password" placeholder="Parol">

  <button onclick="login()">Kirish</button>

  <div id="loginMessage" class="message"></div>
</div>

<div id="dashboard" class="dashboard">
  <div class="container">

    <h2>Dashboard</h2>

    <div class="cards">

      <div class="card">
        <h3>Mahsulotlar</h3>
        <div id="productCount" class="number">0</div>
      </div>

      <div class="card">
        <h3>Faol mahsulotlar</h3>
        <div id="activeCount" class="number">0</div>
      </div>

      <div class="card">
        <h3>Buyurtmalar</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Foydalanuvchilar</h3>
        <div class="number">0</div>
      </div>

    </div>

    <div class="section">

      <h2>Mahsulotlar</h2>

      <button onclick="loadProducts()">🔄 Yangilash</button>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nomi</th>
            <th>Narxi</th>
            <th>Holati</th>
          </tr>
        </thead>

        <tbody id="productsTable">
          <tr>
            <td colspan="4">Mahsulotlar yuklanmoqda...</td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>

<script>

const ADMIN_LOGIN = "admin";
const ADMIN_PASSWORD = "123456";

/*
  Keyingi qadamda Railway server URL'sini shu yerga ulaymiz.
*/
const API_URL = "";

function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  if(username === ADMIN_LOGIN && password === ADMIN_PASSWORD){

    localStorage.setItem("tegen_admin","true");

    showDashboard();

  }else{

    document.getElementById("loginMessage").textContent =
      "Login yoki parol noto'g'ri.";

  }
}

function logout(){

  localStorage.removeItem("tegen_admin");

  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginPage").style.display="block";

}

function showDashboard(){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").style.display="block";

  loadProducts();

}

async function loadProducts(){

  const table =
    document.getElementById("productsTable");

  try{

    if(!API_URL){

      table.innerHTML=`
        <tr>
          <td colspan="4">
            API URL hali ulanmagan.
          </td>
        </tr>
      `;

      return;
    }

    const response =
      await fetch(API_URL + "/products");

    if(!response.ok){
      throw new Error("API xatosi");
    }

    const products =
      await response.json();

    document.getElementById("productCount")
      .textContent=products.length;

    document.getElementById("activeCount")
      .textContent=
        products.filter(p=>p.isActive).length;

    if(products.length===0){

      table.innerHTML=`
        <tr>
          <td colspan="4">
            Mahsulotlar yo'q.
          </td>
        </tr>
      `;

      return;
    }

    table.innerHTML =
      products.map(product=>`
        <tr>
          <td>${product.id}</td>
          <td>${escapeHtml(product.name || product.title || "")}</td>
          <td>${Number(product.price).toLocaleString()} so'm</td>
          <td>${product.isActive ? "✅ Faol" : "❌ Nofaol"}</td>
        </tr>
      `).join("");

  }catch(error){

    table.innerHTML=`
      <tr>
        <td colspan="4">
          Server bilan bog'lanib bo'lmadi.
        </td>
      </tr>
    `;

  }
}

function escapeHtml(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

if(localStorage.getItem("tegen_admin")==="true"){
  showDashboard();
}

</script>

</body>
</html>
